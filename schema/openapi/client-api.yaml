components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Device-bound user access token.
    deviceId:
      type: apiKey
      in: header
      name: X-Device-Id
      description: UUID of the authenticated device.
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    FromUserId: {name: from_user_id, in: path, required: true, schema: {type: string, format: uuid}}
    MessageId: {name: msg_id, in: path, required: true, schema: {$ref: '#/components/schemas/DecimalInt64String'}}
    PostId: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/DecimalInt64String'}}
    CommentId: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/DecimalInt64String'}}
    ChatId: {name: chat_id, in: path, required: true, schema: {type: string, format: uuid}}
    GroupId: {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    MediaId: {name: media_id, in: path, required: true, schema: {type: string, format: uuid}}
    ObjectId: {name: object_id, in: path, required: true, schema: {type: string, format: uuid}}
    TransferId: {name: transfer_id, in: path, required: true, schema: {type: string, format: uuid}}
    TokenId: {name: token_id, in: path, required: true, schema: {type: string, format: uuid}}
    InstallationId: {name: installation_id, in: path, required: true, schema: {type: string, format: uuid}}
    Version: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    Cursor: {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 2048}, description: Opaque continuation cursor.}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; replay result retained for 24 hours per device. Never sent in a JSON body.
      schema: {type: string, format: uuid}
    AttestationToken:
      name: X-Attestation-Token
      in: header
      required: false
      description: Required for mobile clients according to platform policy.
      schema: {type: string, minLength: 16, maxLength: 8192}
    ConversationType: {name: conversation_type, in: query, required: true, schema: {type: string, enum: [chat, group]}}
    ConversationId: {name: conversation_id, in: query, required: true, schema: {type: string, format: uuid}}
    Epoch: {name: epoch, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}Q[1-4]$'}}
    Shard: {name: shard, in: query, required: true, schema: {type: integer, minimum: 0}}
    Direction: {name: direction, in: query, required: true, schema: {type: string, enum: [incoming, outgoing]}}
    TargetType: {name: target_type, in: query, required: true, schema: {$ref: '#/components/schemas/PublicTargetType'}}
    TargetId: {name: target_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
    SubjectType: {name: subject_type, in: query, required: true, schema: {$ref: '#/components/schemas/PublicTargetType'}}
    SubjectId: {name: subject_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
    Shelf: {name: shelf, in: query, required: true, schema: {type: string, const: public}}
  headers:
    RateLimitLimit: {description: Request limit for the active bucket., schema: {type: integer, minimum: 0}}
    RateLimitRemaining: {description: Requests left in the active bucket., schema: {type: integer, minimum: 0}}
    RateLimitReset: {description: Unix epoch seconds when the bucket resets., schema: {type: integer, minimum: 0}}
    RetryAfter: {description: Seconds before retrying., schema: {type: integer, minimum: 1}}
    RequestId: {description: Correlation UUID., schema: {type: string, format: uuid}}
  responses:
    Error:
      description: Validation, authentication, authorization, absence, conflict, rate-limit or dependency failure.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        X-RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        X-RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
        X-RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  requestBodies:
    RegisterStart: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterStart'}}}}
    RegisterVerify: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterVerify'}}}}
    Login: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
    Refresh: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Refresh'}}}}
    IosAttestation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IosAttestation'}}}}
    AndroidIntegrity: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AndroidIntegrity'}}}}
    UserPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserPatch'}}}}
    LinkSession: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LinkSession'}}}}
    LinkConfirm: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LinkConfirm'}}}}
    LinkClaim: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LinkClaim'}}}}
    PushRegistration: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PushRegistration'}}}}
    KeyBundle: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KeyBundleWrite'}}}}
    Prekeys: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrekeyBatch'}}}}
    ChatCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChatCreate'}}}}
    PrivateMessage: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMessageWrite'}}}}
    GroupMessage: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupMessageWrite'}}}}
    ReadCursor: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReadCursor'}}}}
    GroupCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupCreate'}}}}
    GroupMember: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupMemberAdd'}}}}
    ChannelCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelCreate'}}}}
    ChannelPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelPatch'}}}}
    CommunityCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommunityCreate'}}}}
    CommunityObject: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommunityObjectWrite'}}}}
    ObjectAcl: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObjectAclWrite'}}}}
    VoiceRoomCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VoiceRoomCreate'}}}}
    MediaUploadCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUploadCreate'}}}}
    MediaComplete: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MediaComplete'}}}}
    MediaAccess: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAccessRequest'}}}}
    PostWrite: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostWrite'}}}}
    PublicDocument: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicDocumentWrite'}}}}
    Schedule: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Schedule'}}}}
    Rejection: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Rejection'}}}}
    FriendRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FriendRequestWrite'}}}}
    RecoveryRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryRequestWrite'}}}}
    RecoveryChunks: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryChunks'}}}}
    RecoveryDecline: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryDecline'}}}}
    RecoveryConfirm: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryConfirm'}}}}
    PhraseBackup: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PhraseBackupWrite'}}}}
    CommentCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentCreate'}}}}
    Emotion: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmotionWrite'}}}}
    Recommendation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecommendationWrite'}}}}
    AttributeCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AttributeCreate'}}}}
    Favorite: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FavoriteWrite'}}}}
    PrivateShelf: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateShelfWrite'}}}}
    ShelfAccessRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShelfAccessRequest'}}}}
    ShelfAccessGrant: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShelfAccessGrant'}}}}
    ShelfAccessRevoke: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShelfAccessRevoke'}}}}
    CallCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CallCreate'}}}}
    CallEnd: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CallEnd'}}}}
    Report: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportWrite'}}}}
    VirtualUserCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualUserCreate'}}}}
    VirtualUserPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualUserPatch'}}}}
    OperatorGrant: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperatorGrant'}}}}
    KeyRotation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KeyRotationRequest'}}}}
    VirtualTransfer: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualTransferWrite'}}}}
    TransferAccept: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferAccept'}}}}
    AppCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AppCreate'}}}}
    AppPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AppPatch'}}}}
    AppToken: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AppTokenWrite'}}}}
    InstallationCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InstallationCreate'}}}}
    InboxThreadPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InboxThreadPatch'}}}}
    EventIds: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventIds'}}}}
    InboxPreferences: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InboxPreferencesWrite'}}}}
    Appeal: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AppealWrite'}}}}
    EntityMessage: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EntityMessageWrite'}}}}

  schemas:
    Uuid: {type: string, format: uuid}
    DecimalInt64String:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Positive PostgreSQL BIGINT serialized as a decimal string for JavaScript safety; values must not exceed 9223372036854775807.
      x-tima-decimal-maximum: '9223372036854775807'
    Timestamp: {type: string, format: date-time}
    Base64: {type: string, contentEncoding: base64}
    Region: {type: string, enum: [RU, EU]}
    PublicTargetType: {type: string, enum: [post, comment, user, virtual_user, group, channel, community]}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
            message: {type: string, minLength: 1}
            details: {type: object, additionalProperties: true}
            request_id: {$ref: '#/components/schemas/Uuid'}
    RegisterStart:
      type: object
      additionalProperties: false
      required: [phone, locale]
      properties:
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
    OtpChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at, resend_after]
      properties:
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        resend_after: {type: integer, minimum: 0}
    RegisterVerify:
      type: object
      additionalProperties: false
      required: [challenge_id, otp, password, device]
      properties:
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        otp: {type: string, pattern: '^[0-9]{6}$'}
        password: {type: string, minLength: 12, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 100}
        device: {$ref: '#/components/schemas/DeviceRegistration'}
    Login:
      type: object
      additionalProperties: false
      required: [phone, password, device]
      properties:
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        password: {type: string, minLength: 1, maxLength: 128}
        device: {$ref: '#/components/schemas/DeviceRegistration'}
    Refresh:
      type: object
      additionalProperties: false
      required: [refresh_token, device_id]
      properties:
        refresh_token: {type: string, minLength: 32}
        device_id: {$ref: '#/components/schemas/Uuid'}
    AuthSession:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, user, device]
      properties:
        access_token: {type: string, minLength: 32}
        refresh_token: {type: string, minLength: 32}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, minimum: 1}
        user: {$ref: '#/components/schemas/User'}
        device: {$ref: '#/components/schemas/Device'}
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [name, platform, identity_public_key, signing_public_key]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        platform: {type: string, enum: [ios, android, windows]}
        app_version: {type: string, maxLength: 32}
        identity_public_key: {type: string, contentEncoding: base64, description: X25519 public key used for device key agreement.}
        signing_public_key: {type: string, contentEncoding: base64, description: Ed25519 public key used to verify device signatures.}
    IosAttestation:
      type: object
      additionalProperties: false
      required: [key_id, assertion, challenge]
      properties:
        key_id: {type: string, minLength: 1}
        assertion: {$ref: '#/components/schemas/Base64'}
        challenge: {$ref: '#/components/schemas/Base64'}
    AndroidIntegrity:
      type: object
      additionalProperties: false
      required: [integrity_token, nonce]
      properties:
        integrity_token: {type: string, minLength: 32}
        nonce: {$ref: '#/components/schemas/Base64'}
    AttestationResult:
      type: object
      additionalProperties: false
      required: [attestation_token, expires_at, verdict]
      properties:
        attestation_token: {type: string, minLength: 16}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        verdict: {type: string, enum: [trusted, limited]}
    User:
      type: object
      additionalProperties: false
      required: [id, account_type, display_name, account_home_region, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        account_type: {type: string, enum: [human, virtual]}
        username: {type: string, pattern: '^[a-zA-Z0-9_]{3,32}$'}
        display_name: {type: string, minLength: 1, maxLength: 100}
        bio: {type: string, maxLength: 1000}
        avatar_media_id: {$ref: '#/components/schemas/Uuid'}
        account_home_region: {$ref: '#/components/schemas/Region'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username: {type: string, pattern: '^[a-zA-Z0-9_]{3,32}$'}
        display_name: {type: string, minLength: 1, maxLength: 100}
        bio: {type: string, maxLength: 1000}
        avatar_media_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
    Device:
      type: object
      additionalProperties: false
      required: [id, name, platform, created_at, last_seen_at, current]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        platform: {type: string, enum: [ios, android, windows]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_seen_at: {$ref: '#/components/schemas/Timestamp'}
        current: {type: boolean}
        revoked_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    DeviceList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Device'}}}
    LinkSession:
      type: object
      additionalProperties: false
      required: [desktop_public_key, signing_public_key, desktop_name]
      properties:
        desktop_public_key: {$ref: '#/components/schemas/Base64'}
        signing_public_key: {$ref: '#/components/schemas/Base64'}
        desktop_name: {type: string, minLength: 1, maxLength: 100}
    LinkChallenge:
      type: object
      additionalProperties: false
      required: [session_id, qr_payload, claim_token, expires_at]
      properties:
        session_id: {$ref: '#/components/schemas/Uuid'}
        qr_payload: {type: string, minLength: 16}
        claim_token: {type: string, minLength: 32}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    LinkConfirm:
      type: object
      additionalProperties: false
      required: [session_id, qr_secret, confirmation, wrapped_device_secret]
      properties:
        session_id: {$ref: '#/components/schemas/Uuid'}
        qr_secret: {type: string, minLength: 32}
        confirmation: {$ref: '#/components/schemas/Base64'}
        wrapped_device_secret: {$ref: '#/components/schemas/Base64'}
    LinkClaim:
      type: object
      additionalProperties: false
      required: [session_id, claim_token]
      properties:
        session_id: {$ref: '#/components/schemas/Uuid'}
        claim_token: {type: string, minLength: 32}
    LinkedAuthSession:
      allOf:
        - {$ref: '#/components/schemas/AuthSession'}
        - type: object
          required: [wrapped_device_secret]
          properties:
            wrapped_device_secret: {$ref: '#/components/schemas/Base64'}
    PushRegistration:
      type: object
      additionalProperties: false
      required: [provider, token]
      properties:
        provider: {type: string, enum: [fcm, apns, wns]}
        token: {type: string, minLength: 16, maxLength: 4096}
    SignedPrekey:
      type: object
      additionalProperties: false
      required: [id, public_key, signature, expires_at]
      properties:
        id: {type: integer, minimum: 1}
        public_key: {$ref: '#/components/schemas/Base64'}
        signature: {$ref: '#/components/schemas/Base64'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    OneTimePrekey:
      type: object
      additionalProperties: false
      required: [id, public_key]
      properties:
        id: {type: integer, minimum: 1}
        public_key: {$ref: '#/components/schemas/Base64'}
    KeyBundleWrite:
      type: object
      additionalProperties: false
      required: [device_id, identity_key]
      properties:
        device_id: {$ref: '#/components/schemas/Uuid'}
        identity_key: {$ref: '#/components/schemas/Base64', description: Required X25519 identity public key.}
        signed_prekey: {$ref: '#/components/schemas/SignedPrekey', description: Optional Signed PreKey for clients using a prekey handshake; envelope-only alpha clients omit it.}
        one_time_prekeys: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/OneTimePrekey'}}
    KeyBundle:
      allOf:
        - {$ref: '#/components/schemas/KeyBundleWrite'}
        - type: object
          required: [signing_identity_key, updated_at]
          properties:
            signing_identity_key: {$ref: '#/components/schemas/Base64', description: Ed25519 identity key used to verify envelopes signed by this device.}
            updated_at: {$ref: '#/components/schemas/Timestamp'}
    UserKeyBundles:
      type: object
      additionalProperties: false
      required: [user_id, bundles]
      properties:
        user_id: {$ref: '#/components/schemas/Uuid'}
        bundles: {type: array, items: {$ref: '#/components/schemas/KeyBundle'}}
    PrekeyBatch:
      type: object
      additionalProperties: false
      required: [device_id, prekeys]
      properties:
        device_id: {$ref: '#/components/schemas/Uuid'}
        prekeys: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/OneTimePrekey'}}
    PrekeyResult:
      type: object
      additionalProperties: false
      required: [stored, available]
      properties:
        stored: {type: integer, minimum: 0}
        available: {type: integer, minimum: 0}
    EscrowPublicKeys:
      type: object
      additionalProperties: false
      required: [x25519_threshold, mlkem768]
      properties:
        x25519_threshold: {$ref: '#/components/schemas/Base64'}
        mlkem768: {$ref: '#/components/schemas/Base64'}
    EscrowNextKeys:
      allOf:
        - {$ref: '#/components/schemas/EscrowPublicKeys'}
        - type: object
          required: [epoch_id, key_id]
          properties:
            epoch_id: {type: string, pattern: '^[0-9]{4}Q[1-4]$'}
            key_id: {type: string}
    EscrowConfig:
      type: object
      additionalProperties: false
      required: [config_version, region, epoch_id, shard_id, key_id, valid_from, valid_until, current_public_keys, next_public_keys, signer_key_id, signature]
      properties:
        config_version: {type: integer, minimum: 1}
        region: {$ref: '#/components/schemas/Region'}
        epoch_id: {type: string, pattern: '^[0-9]{4}Q[1-4]$'}
        shard_id: {type: integer, minimum: 0}
        key_id: {type: string}
        valid_from: {$ref: '#/components/schemas/Timestamp'}
        valid_until: {$ref: '#/components/schemas/Timestamp'}
        current_public_keys: {$ref: '#/components/schemas/EscrowPublicKeys'}
        next_public_keys: {$ref: '#/components/schemas/EscrowNextKeys'}
        signer_key_id: {type: string}
        signature: {$ref: '#/components/schemas/Base64'}
    ChatCreate:
      type: object
      additionalProperties: false
      required: [peer_user_id]
      properties: {peer_user_id: {$ref: '#/components/schemas/Uuid'}}
    Chat:
      type: object
      additionalProperties: false
      required: [id, peer, conversation_home_region, created_at, unread_count]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        peer: {$ref: '#/components/schemas/User'}
        conversation_home_region: {$ref: '#/components/schemas/Region'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_message_at: {$ref: '#/components/schemas/Timestamp'}
        unread_count: {type: integer, minimum: 0}
    ChatList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Chat'}}
        next_cursor: {type: string}
    MessageReservation:
      type: object
      additionalProperties: false
      required: [message_id, revision_id, expires_at]
      properties:
        message_id: {$ref: '#/components/schemas/DecimalInt64String'}
        revision_id: {$ref: '#/components/schemas/Uuid'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    PrivateDocumentEnvelope:
      $ref: ../json/private-document-envelope.schema.json
    PublicDocument:
      $ref: ../json/document-v2.schema.json#/$defs/publicDocument
    WrappedKey:
      type: object
      additionalProperties: false
      required: [device_id, wrapped_key, protocol_version, key_commitment]
      properties:
        device_id: {$ref: '#/components/schemas/Uuid'}
        wrapped_key: {$ref: '#/components/schemas/Base64'}
        protocol_version: {type: integer, const: 2}
        key_commitment: {type: string, contentEncoding: base64, description: Exactly 32 decoded bytes.}
    PrivateMessageWrite:
      type: object
      additionalProperties: false
      description: Private message submission using server-assigned reservation identifiers in canonical signing. For an initial message, document.metadata.revision_number remains 1.
      required: [message_id, revision_id, message_key_id, document, wrapped_keys]
      properties:
        sender_id: {$ref: '#/components/schemas/Uuid'}
        message_id: {$ref: '#/components/schemas/DecimalInt64String'}
        revision_id: {type: string, format: uuid, description: Server-assigned revision identifier returned by reserveChatMessage and included in canonical signing.}
        message_key_id: {type: integer, minimum: 0, description: Message-key identifier included in canonical signing.}
        document: {$ref: '#/components/schemas/PrivateDocumentEnvelope'}
        wrapped_keys: {type: array, minItems: 1, items: {$ref: '#/components/schemas/WrappedKey'}}
    GroupMessageWrite:
      oneOf:
        - {$ref: '#/components/schemas/PrivateMessageWrite'}
        - {$ref: '#/components/schemas/PublicDocumentWrite'}
    PublicDocumentWrite:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        author_user_id: {$ref: '#/components/schemas/Uuid'}
        document: {$ref: '#/components/schemas/PublicDocument'}
    RevisionBase:
      type: object
      required: [id, parent_revision_id, revision_number, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        parent_revision_id: {$ref: '#/components/schemas/Uuid'}
        revision_number: {type: integer, minimum: 1}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    PrivateRevision:
      allOf:
        - {$ref: '#/components/schemas/RevisionBase'}
        - type: object
          required: [document]
          properties: {document: {$ref: '#/components/schemas/PrivateDocumentEnvelope'}}
      unevaluatedProperties: false
    PublicRevision:
      allOf:
        - {$ref: '#/components/schemas/RevisionBase'}
        - type: object
          required: [document]
          properties: {document: {$ref: '#/components/schemas/PublicDocument'}}
      unevaluatedProperties: false
    Revision:
      oneOf:
        - {$ref: '#/components/schemas/PrivateRevision'}
        - {$ref: '#/components/schemas/PublicRevision'}
    MessageBase:
      type: object
      required: [id, conversation_id, sender_id, current_revision_id, created_at]
      properties:
        id: {$ref: '#/components/schemas/DecimalInt64String'}
        conversation_id: {$ref: '#/components/schemas/Uuid'}
        sender_id: {$ref: '#/components/schemas/Uuid'}
        current_revision_id: {$ref: '#/components/schemas/Uuid'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        deleted_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    PrivateMessage:
      allOf:
        - {$ref: '#/components/schemas/MessageBase'}
        - type: object
          required: [sender_device_id, message_key_id, document, wrapped_keys]
          properties:
            sender_device_id: {type: string, format: uuid, description: Device whose signing identity produced the current private revision.}
            message_key_id: {type: integer, minimum: 0, description: Message-key identifier included in canonical signing.}
            parent_revision_id:
              oneOf:
                - {$ref: '#/components/schemas/Uuid'}
                - {type: 'null'}
              description: Server emits explicit null for revision 1; otherwise the signed parent revision identifier.
            document: {$ref: '#/components/schemas/PrivateDocumentEnvelope'}
            wrapped_keys: {type: array, minItems: 1, items: {$ref: '#/components/schemas/WrappedKey'}}
      unevaluatedProperties: false
    PublicMessage:
      allOf:
        - {$ref: '#/components/schemas/MessageBase'}
        - type: object
          required: [document]
          properties:
            document: {$ref: '#/components/schemas/PublicDocument'}
      unevaluatedProperties: false
    Message:
      oneOf:
        - {$ref: '#/components/schemas/PrivateMessage'}
        - {$ref: '#/components/schemas/PublicMessage'}
    PrivateMessageList:
      type: object
      required: [items]
      description: History projection for the authenticated device. Every wrapped_keys array contains only the key authorized for the current X-Device-Id.
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PrivateMessage'}, description: Messages projected to the authenticated device; wrapped_keys never exposes entries for another device.}
        next_cursor: {type: string}
    MessageList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Message'}}
        next_cursor: {type: string}
    ReadCursor:
      type: object
      additionalProperties: false
      required: [message_id]
      properties: {message_id: {$ref: '#/components/schemas/DecimalInt64String'}}
    ReadState:
      type: object
      additionalProperties: false
      required: [conversation_id, last_read_message_id, read_at]
      properties:
        conversation_id: {$ref: '#/components/schemas/Uuid'}
        last_read_message_id: {$ref: '#/components/schemas/DecimalInt64String'}
        read_at: {$ref: '#/components/schemas/Timestamp'}
    GroupCreate:
      type: object
      additionalProperties: false
      required: [title, kind, member_ids]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        kind: {type: string, enum: [private, public]}
        description: {type: string, maxLength: 2000}
        avatar_media_id: {$ref: '#/components/schemas/Uuid'}
        member_ids: {type: array, uniqueItems: true, maxItems: 10000, items: {$ref: '#/components/schemas/Uuid'}}
    Group:
      type: object
      additionalProperties: false
      required: [id, title, kind, conversation_home_region, member_count, gk_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        kind: {type: string, enum: [private, public]}
        description: {type: string}
        avatar_media_id: {$ref: '#/components/schemas/Uuid'}
        conversation_home_region: {$ref: '#/components/schemas/Region'}
        member_count: {type: integer, minimum: 1}
        gk_version: {type: integer, minimum: 1}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    GroupMemberAdd:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: {$ref: '#/components/schemas/Uuid'}
        role: {type: string, enum: [member, moderator, admin]}
    GroupMember:
      allOf:
        - {$ref: '#/components/schemas/GroupMemberAdd'}
        - {type: object, required: [joined_at], properties: {joined_at: {$ref: '#/components/schemas/Timestamp'}}}
    WrappedGroupKey:
      type: object
      additionalProperties: false
      required: [group_id, version, device_id, protocol_version, key_commitment, wrapped_gk]
      properties:
        group_id: {$ref: '#/components/schemas/Uuid'}
        version: {type: integer, minimum: 1}
        device_id: {$ref: '#/components/schemas/Uuid'}
        protocol_version: {type: integer, const: 2}
        key_commitment: {type: string, contentEncoding: base64}
        wrapped_gk: {$ref: '#/components/schemas/Base64'}
    ChannelCreate:
      type: object
      additionalProperties: false
      required: [community_id, title]
      properties:
        community_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000}
        avatar_media_id: {$ref: '#/components/schemas/Uuid'}
        who_can_post: {type: string, enum: [admins, admins_authors, members]}
    ChannelPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000}
        avatar_media_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        who_can_post: {type: string, enum: [admins, admins_authors, members]}
    Channel:
      allOf:
        - {$ref: '#/components/schemas/ChannelCreate'}
        - type: object
          required: [id, subscriber_count, subscribed, created_at]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            subscriber_count: {type: integer, minimum: 0}
            subscribed: {type: boolean}
            created_at: {$ref: '#/components/schemas/Timestamp'}
    CommunityCreate:
      type: object
      additionalProperties: false
      required: [title, visibility]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000}
        avatar_media_id: {$ref: '#/components/schemas/Uuid'}
        visibility: {type: string, enum: [public, private]}
    Community:
      allOf:
        - {$ref: '#/components/schemas/CommunityCreate'}
        - type: object
          required: [id, owner_user_id, subscriber_count, subscribed, objects, created_at]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            owner_user_id: {$ref: '#/components/schemas/Uuid'}
            subscriber_count: {type: integer, minimum: 0}
            subscribed: {type: boolean}
            objects: {type: array, items: {$ref: '#/components/schemas/CommunityObject'}}
            created_at: {$ref: '#/components/schemas/Timestamp'}
    CommunityObjectWrite:
      type: object
      additionalProperties: false
      required: [object_type]
      properties:
        object_type: {type: string, enum: [group, channel, voice_room]}
        object_id: {$ref: '#/components/schemas/Uuid'}
        create:
          oneOf:
            - {$ref: '#/components/schemas/GroupCreate'}
            - {$ref: '#/components/schemas/ChannelCreate'}
            - {$ref: '#/components/schemas/VoiceRoomCreate'}
    CommunityObject:
      type: object
      additionalProperties: false
      required: [object_type, object_id, acl]
      properties:
        object_type: {type: string, enum: [group, channel, voice_room]}
        object_id: {$ref: '#/components/schemas/Uuid'}
        acl: {$ref: '#/components/schemas/ObjectAcl'}
    ObjectAclWrite:
      type: object
      additionalProperties: false
      required: [visibility, join_policy, post_policy]
      properties:
        visibility: {type: string, enum: [public, members, admins]}
        join_policy: {type: string, enum: [open, approval, invite]}
        post_policy: {type: string, enum: [members, authors, admins]}
    ObjectAcl:
      allOf:
        - {$ref: '#/components/schemas/ObjectAclWrite'}
        - {type: object, required: [updated_at], properties: {updated_at: {$ref: '#/components/schemas/Timestamp'}}}
    VoiceRoomCreate:
      type: object
      additionalProperties: false
      required: [community_id, title]
      properties:
        community_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string, minLength: 1, maxLength: 200}
        attached_type: {type: string, enum: [group, channel]}
        attached_id: {$ref: '#/components/schemas/Uuid'}
    VoiceRoom:
      allOf:
        - {$ref: '#/components/schemas/VoiceRoomCreate'}
        - {type: object, required: [id, status, participant_count, created_at], properties: {id: {$ref: '#/components/schemas/Uuid'}, status: {type: string, enum: [open, ended]}, participant_count: {type: integer, minimum: 0}, created_at: {$ref: '#/components/schemas/Timestamp'}}}
    RtcGrant:
      type: object
      additionalProperties: false
      required: [room_id, server_url, token, expires_at]
      properties:
        room_id: {$ref: '#/components/schemas/Uuid'}
        server_url: {type: string, format: uri}
        token: {type: string, minLength: 16}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    MediaVariantInput:
      type: object
      additionalProperties: false
      required: [name, content_type, size, sha256]
      properties:
        name: {type: string, enum: [thumbnail, preview, full]}
        content_type: {type: string, pattern: '^[a-z0-9.+-]+/[a-z0-9.+-]+$'}
        size: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    MediaUploadCreate:
      type: object
      additionalProperties: false
      required: [kind, variants]
      properties:
        kind: {type: string, enum: [image, video, audio, file]}
        variants: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/MediaVariantInput'}}
    UploadSlot:
      type: object
      additionalProperties: false
      required: [variant, method, url, headers, expires_at]
      properties:
        variant: {type: string}
        method: {type: string, const: PUT}
        url: {type: string, format: uri}
        headers: {type: object, additionalProperties: {type: string}}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    MediaUpload:
      type: object
      additionalProperties: false
      required: [media_id, content_mode, uploads, expires_at]
      properties:
        media_id: {$ref: '#/components/schemas/Uuid'}
        content_mode: {type: string, enum: [private, public]}
        uploads: {type: array, items: {$ref: '#/components/schemas/UploadSlot'}}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    MediaComplete:
      type: object
      additionalProperties: false
      required: [variants]
      properties:
        variants: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/MediaVariantInput'}}
    Media:
