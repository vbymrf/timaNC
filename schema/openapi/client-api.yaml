openapi: 3.1.0
info:
  title: Tima Client API
  version: 1.0.0-phase1-slice1
  description: |
    User-facing REST contract. Bot runtime, WebSocket, operations, internal and legal APIs are excluded.
    All timestamps are RFC 3339 UTC. All IDs are UUIDs unless a schema says otherwise.
    Successful and error responses may include X-RateLimit-Limit, X-RateLimit-Remaining and
    X-RateLimit-Reset. A 429 response also includes Retry-After.
  x-tima-implementation-phase: phase-0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.tima.example/v1
security:
  - bearerAuth: []
    deviceId: []
tags:
  - {name: Auth}
  - {name: Users}
  - {name: Keys}
  - {name: Chats}
  - {name: Groups}
  - {name: Channels}
  - {name: Communities}
  - {name: Voice rooms}
  - {name: Media}
  - {name: Posts}
  - {name: Social graph}
  - {name: Recovery}
  - {name: Comments}
  - {name: Reactions}
  - {name: Discovery}
  - {name: Calls}
  - {name: Reports}
  - {name: Virtual users}
  - {name: Owner apps}
  - {name: Inbox}

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: startRegistration
      security: []
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/RegisterStart'}
      responses:
        '202': {description: OTP sent, content: {application/json: {schema: {$ref: '#/components/schemas/OtpChallenge'}}}}
        default: {$ref: '#/components/responses/Error'}
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyRegistration
      security: []
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/AttestationToken'}]
      requestBody: {$ref: '#/components/requestBodies/RegisterVerify'}
      responses:
        '201': {description: Account and session created, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        default: {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/AttestationToken'}]
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        default: {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/Refresh'}
      responses:
        '200': {description: Tokens rotated, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-tima-implementation-phase: phase-1
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Error'}
  /verify/attestation/ios:
    post:
      tags: [Auth]
      operationId: verifyIosAttestation
      security: []
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/IosAttestation'}
      responses:
        '200': {description: Attestation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AttestationResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /verify/integrity/android:
    post:
      tags: [Auth]
      operationId: verifyAndroidIntegrity
      security: []
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/AndroidIntegrity'}
      responses:
        '200': {description: Integrity accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AttestationResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      x-tima-implementation-phase: phase-1
      responses:
        '200': {description: Current profile, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/UserPatch'}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        default: {$ref: '#/components/responses/Error'}
  /devices:
    get:
      tags: [Users]
      operationId: listDevices
      x-tima-implementation-phase: phase-1
      responses:
        '200': {description: Active sessions, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceList'}}}}
        default: {$ref: '#/components/responses/Error'}
  /devices/{id}:
    delete:
      tags: [Users]
      operationId: revokeDevice
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Device revoked}
        default: {$ref: '#/components/responses/Error'}
  /devices/push:
    put:
      tags: [Users]
      operationId: registerDevicePush
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/PushRegistration'}
      responses:
        '204': {description: Push registration stored}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Users]
      operationId: deleteDevicePush
      x-tima-implementation-phase: phase-1
      responses:
        '204': {description: Push registration removed}
        default: {$ref: '#/components/responses/Error'}
  /link/session:
    post:
      tags: [Users]
      operationId: startDeviceLink
      security: []
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/LinkSession'}
      responses:
        '201': {description: Link session, content: {application/json: {schema: {$ref: '#/components/schemas/LinkChallenge'}}}}
        default: {$ref: '#/components/responses/Error'}
  /link/confirm:
    post:
      tags: [Users]
      operationId: confirmDeviceLink
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/LinkConfirm'}
      responses:
        '200': {description: Linked device, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        default: {$ref: '#/components/responses/Error'}
  /link/claim:
    post:
      tags: [Users]
      operationId: claimDeviceLink
      security: []
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/LinkClaim'}
      responses:
        '200': {description: Desktop session and wrapped device secret, content: {application/json: {schema: {$ref: '#/components/schemas/LinkedAuthSession'}}}}
        default: {$ref: '#/components/responses/Error'}

  /keys/bundle:
    put:
      tags: [Keys]
      operationId: putKeyBundle
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/KeyBundle'}
      responses:
        '200': {description: Bundle stored, content: {application/json: {schema: {$ref: '#/components/schemas/KeyBundle'}}}}
        default: {$ref: '#/components/responses/Error'}
  /keys/bundle/{user_id}:
    get:
      tags: [Keys]
      operationId: getKeyBundle
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200': {description: Device bundles and consumed one-time prekey, content: {application/json: {schema: {$ref: '#/components/schemas/UserKeyBundles'}}}}
        default: {$ref: '#/components/responses/Error'}
  /keys/prekeys/replenish:
    post:
      tags: [Keys]
      operationId: replenishPrekeys
      x-tima-implementation-phase: phase-1
      requestBody: {$ref: '#/components/requestBodies/Prekeys'}
      responses:
        '200': {description: Prekeys stored, content: {application/json: {schema: {$ref: '#/components/schemas/PrekeyResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /escrow/config:
    get:
      tags: [Keys]
      operationId: getEscrowConfig
      x-tima-implementation-phase: phase-1
      parameters:
        - {$ref: '#/components/parameters/ConversationType'}
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/Shard'}
      responses:
        '200': {description: Signed current and next regional public configuration, content: {application/json: {schema: {$ref: '#/components/schemas/EscrowConfig'}}}}
        default: {$ref: '#/components/responses/Error'}

  /chats:
    get:
      tags: [Chats]
      operationId: listChats
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Chats, content: {application/json: {schema: {$ref: '#/components/schemas/ChatList'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Chats]
      operationId: createChat
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ChatCreate'}
      responses:
        '201': {description: Chat created, content: {application/json: {schema: {$ref: '#/components/schemas/Chat'}}}}
        default: {$ref: '#/components/responses/Error'}
  /chats/{id}/messages:
    get:
      tags: [Chats]
      operationId: listChatMessages
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Private message history. Each message includes only the wrapped key authorized for the authenticated X-Device-Id; wrapped keys for other devices are never returned., content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMessageList'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Chats]
      operationId: sendChatMessage
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PrivateMessage'}
      responses:
        '201': {description: Private message accepted, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateMessage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /chats/{id}/message-reservations:
    post:
      tags: [Chats]
      operationId: reserveChatMessage
      security:
        - bearerAuth: []
          deviceId: []
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {description: Server-assigned identifiers reserved for canonical message signing., content: {application/json: {schema: {$ref: '#/components/schemas/MessageReservation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /chats/{id}/messages/{msg_id}:
    delete:
      tags: [Chats]
      operationId: deleteChatMessage
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/MessageId'}]
      responses:
        '204': {description: Message soft-deleted}
        default: {$ref: '#/components/responses/Error'}
  /chats/{id}/messages/{msg_id}/revisions:
    post:
      tags: [Chats]
      operationId: reviseChatMessage
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/MessageId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/PrivateMessage'}
      responses:
        '201': {description: Immutable private revision, content: {application/json: {schema: {$ref: '#/components/schemas/PrivateRevision'}}}}
        default: {$ref: '#/components/responses/Error'}
  /chats/{id}/read:
    post:
      tags: [Chats]
      operationId: markChatRead
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/ReadCursor'}
      responses:
        '200': {description: Read cursor stored, content: {application/json: {schema: {$ref: '#/components/schemas/ReadState'}}}}
        default: {$ref: '#/components/responses/Error'}

  /groups:
    post:
      tags: [Groups]
      operationId: createGroup
      x-tima-implementation-phase: phase-2
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/GroupCreate'}
      responses:
        '201': {description: Group created, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        default: {$ref: '#/components/responses/Error'}
  /groups/{id}/messages:
    get:
      tags: [Groups]
      operationId: listGroupMessages
      x-tima-implementation-phase: phase-2
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Group history, content: {application/json: {schema: {$ref: '#/components/schemas/MessageList'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Groups]
      operationId: sendGroupMessage
      x-tima-implementation-phase: phase-2
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/GroupMessage'}
      responses:
        '201': {description: Message accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        default: {$ref: '#/components/responses/Error'}
  /groups/{id}/messages/{msg_id}/revisions:
    post:
      tags: [Groups]
      operationId: reviseGroupMessage
      x-tima-implementation-phase: phase-2
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/MessageId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/GroupMessage'}
      responses:
        '201': {description: Immutable revision, content: {application/json: {schema: {$ref: '#/components/schemas/Revision'}}}}
        default: {$ref: '#/components/responses/Error'}
  /groups/{id}/messages/{msg_id}:
    delete:
      tags: [Groups]
      operationId: deleteGroupMessage
      x-tima-implementation-phase: phase-2
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/MessageId'}]
      responses:
        '204': {description: Message soft-deleted}
        default: {$ref: '#/components/responses/Error'}
  /groups/{id}/members:
    post:
      tags: [Groups]
      operationId: addGroupMember
      x-tima-implementation-phase: phase-2
      requestBody: {$ref: '#/components/requestBodies/GroupMember'}
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '201': {description: Member added and GK rotation started, content: {application/json: {schema: {$ref: '#/components/schemas/GroupMember'}}}}
        default: {$ref: '#/components/responses/Error'}
  /groups/{id}/members/{user_id}:
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      x-tima-implementation-phase: phase-2
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: Member removed and GK rotated}
        default: {$ref: '#/components/responses/Error'}
  /groups/{id}/gk/{version}/wrapped:
    get:
      tags: [Groups]
      operationId: getWrappedGroupKey
      x-tima-implementation-phase: phase-2
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Version'}]
      responses:
        '200': {description: Wrapped group key, content: {application/json: {schema: {$ref: '#/components/schemas/WrappedGroupKey'}}}}
        default: {$ref: '#/components/responses/Error'}

  /channels:
    post:
      tags: [Channels]
      operationId: createChannel
      x-tima-implementation-phase: phase-3
      requestBody: {$ref: '#/components/requestBodies/ChannelCreate'}
      responses:
        '201': {description: Channel created, content: {application/json: {schema: {$ref: '#/components/schemas/Channel'}}}}
        default: {$ref: '#/components/responses/Error'}
  /channels/{id}:
    get:
      tags: [Channels]
      operationId: getChannel
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Channel, content: {application/json: {schema: {$ref: '#/components/schemas/Channel'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Channels]
      operationId: updateChannel
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/ChannelPatch'}
      responses:
        '200': {description: Updated channel, content: {application/json: {schema: {$ref: '#/components/schemas/Channel'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Channels]
      operationId: deleteChannel
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Channel soft-deleted}
        default: {$ref: '#/components/responses/Error'}
  /channels/{id}/subscribe:
    post:
      tags: [Channels]
      operationId: subscribeChannel
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Subscribed to channel only}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Channels]
      operationId: unsubscribeChannel
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Unsubscribed}
        default: {$ref: '#/components/responses/Error'}
  /channels/{id}/posts:
    get:
      tags: [Channels]
      operationId: listChannelPosts
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Channel posts, content: {application/json: {schema: {$ref: '#/components/schemas/PostList'}}}}
        default: {$ref: '#/components/responses/Error'}

  /communities:
    post:
      tags: [Communities]
      operationId: createCommunity
      x-tima-implementation-phase: phase-3
      requestBody: {$ref: '#/components/requestBodies/CommunityCreate'}
      responses:
        '201': {description: Community created, content: {application/json: {schema: {$ref: '#/components/schemas/Community'}}}}
        default: {$ref: '#/components/responses/Error'}
  /communities/{id}:
    get:
      tags: [Communities]
      operationId: getCommunity
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Community and child objects, content: {application/json: {schema: {$ref: '#/components/schemas/Community'}}}}
        default: {$ref: '#/components/responses/Error'}
  /communities/{id}/subscribe:
    post:
      tags: [Communities]
      operationId: subscribeCommunity
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Subscribed to community only}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Communities]
      operationId: unsubscribeCommunity
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Unsubscribed}
        default: {$ref: '#/components/responses/Error'}
  /communities/{id}/objects:
    post:
      tags: [Communities]
      operationId: attachCommunityObject
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/CommunityObject'}
      responses:
        '201': {description: Child object attached or created, content: {application/json: {schema: {$ref: '#/components/schemas/CommunityObject'}}}}
        default: {$ref: '#/components/responses/Error'}
  /communities/{id}/objects/{object_id}/acl:
    patch:
      tags: [Communities]
      operationId: updateCommunityObjectAcl
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/ObjectId'}]
      requestBody: {$ref: '#/components/requestBodies/ObjectAcl'}
      responses:
        '200': {description: ACL updated, content: {application/json: {schema: {$ref: '#/components/schemas/ObjectAcl'}}}}
        default: {$ref: '#/components/responses/Error'}

  /voice-rooms:
    post:
      tags: [Voice rooms]
      operationId: createVoiceRoom
      x-tima-implementation-phase: phase-3
      requestBody: {$ref: '#/components/requestBodies/VoiceRoomCreate'}
      responses:
        '201': {description: Voice room created, content: {application/json: {schema: {$ref: '#/components/schemas/VoiceRoom'}}}}
        default: {$ref: '#/components/responses/Error'}
  /voice-rooms/{id}/join:
    post:
      tags: [Voice rooms]
      operationId: joinVoiceRoom
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: LiveKit grant, content: {application/json: {schema: {$ref: '#/components/schemas/RtcGrant'}}}}
        default: {$ref: '#/components/responses/Error'}
  /voice-rooms/{id}/leave:
    post:
      tags: [Voice rooms]
      operationId: leaveVoiceRoom
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Left room}
        default: {$ref: '#/components/responses/Error'}

  /chats/{chat_id}/media/uploads:
    post:
      tags: [Media]
      operationId: createChatMediaUpload
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/ChatId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/MediaUploadCreate'}
      responses:
        '201': {description: Private upload slots, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
        default: {$ref: '#/components/responses/Error'}
  /groups/{group_id}/media/uploads:
    post:
      tags: [Media]
      operationId: createGroupMediaUpload
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/GroupId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/MediaUploadCreate'}
      responses:
        '201': {description: Policy-matched upload slots, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
        default: {$ref: '#/components/responses/Error'}
  /posts/assets:
    post:
      tags: [Media, Posts]
      operationId: createPostAssetUpload
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/MediaUploadCreate'}
      responses:
        '201': {description: Public staging upload slots, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
        default: {$ref: '#/components/responses/Error'}
  /media/uploads/{media_id}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/MediaId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/MediaComplete'}
      responses:
        '202': {description: Scan and processing started, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}
        default: {$ref: '#/components/responses/Error'}
  /media/{media_id}/access:
    post:
      tags: [Media]
      operationId: createMediaAccess
      x-tima-implementation-phase: phase-1
      parameters: [{$ref: '#/components/parameters/MediaId'}]
      requestBody: {$ref: '#/components/requestBodies/MediaAccess'}
      responses:
        '200': {description: Variant URL valid for 15 minutes, content: {application/json: {schema: {$ref: '#/components/schemas/MediaAccess'}}}}
        default: {$ref: '#/components/responses/Error'}

  /posts/drafts:
    post:
      tags: [Posts]
      operationId: createPostDraft
      x-tima-implementation-phase: phase-3
      requestBody: {$ref: '#/components/requestBodies/PostWrite'}
      responses:
        '201': {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/PostDraft'}}}}
        default: {$ref: '#/components/responses/Error'}
  /posts/drafts/{id}:
    get:
      tags: [Posts]
      operationId: getPostDraft
      x-tima-implementation-phase: phase-3
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/PostDraft'}}}}
