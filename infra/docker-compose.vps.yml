services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/media
        mc mb --ignore-existing local/previews
    restart: "no"

  migrate:
    build:
      context: ../server/migrations
      dockerfile: Dockerfile
    image: tima-migrate:${TIMA_VERSION:-phase0}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    restart: "no"

  tima-server:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_MEDIA_BUCKET: media
      MINIO_PREVIEWS_BUCKET: previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
      args:
        CADDY_VERSION: 2.11.4-alpine
        CADDYFILE: Caddyfile.vps
    image: tima-caddy:${TIMA_VERSION:-phase0}
    environment:
      API_DOMAIN: ${API_DOMAIN}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      tima-server:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  livekit-config:
    build:
      context: ./livekit
      dockerfile: Dockerfile
    image: tima-livekit-config:${TIMA_VERSION:-phase0}
    profiles: ["phase2"]
    environment:
      LIVEKIT_BIND_ADDRESS: ${LIVEKIT_BIND_ADDRESS}
      LIVEKIT_UDP_PORT_START: ${LIVEKIT_UDP_PORT_START}
      LIVEKIT_UDP_PORT_END: ${LIVEKIT_UDP_PORT_END}
      LIVEKIT_USE_EXTERNAL_IP: ${LIVEKIT_USE_EXTERNAL_IP}
      LIVEKIT_ENABLE_LOOPBACK_CANDIDATE: ${LIVEKIT_ENABLE_LOOPBACK_CANDIDATE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - livekit_config:/rendered
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed \
          -e 's|$${LIVEKIT_BIND_ADDRESS}|'"$${LIVEKIT_BIND_ADDRESS}"'|g' \
          -e 's|$${LIVEKIT_UDP_PORT_START}|'"$${LIVEKIT_UDP_PORT_START}"'|g' \
          -e 's|$${LIVEKIT_UDP_PORT_END}|'"$${LIVEKIT_UDP_PORT_END}"'|g' \
          -e 's|$${LIVEKIT_USE_EXTERNAL_IP}|'"$${LIVEKIT_USE_EXTERNAL_IP}"'|g' \
          -e 's|$${LIVEKIT_ENABLE_LOOPBACK_CANDIDATE}|'"$${LIVEKIT_ENABLE_LOOPBACK_CANDIDATE}"'|g' \
          -e 's|$${REDIS_PASSWORD}|'"$${REDIS_PASSWORD}"'|g' \
          -e 's|$${LIVEKIT_API_KEY}|'"$${LIVEKIT_API_KEY}"'|g' \
          -e 's|$${LIVEKIT_API_SECRET}|'"$${LIVEKIT_API_SECRET}"'|g' \
          /template/livekit.yaml.template > /rendered/livekit.yaml
    restart: "no"

  livekit:
    image: livekit/livekit-server:v1.13.2
    profiles: ["phase2"]
    command: ["--config", "/etc/livekit/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
      livekit-config:
        condition: service_completed_successfully
    volumes:
      - livekit_config:/etc/livekit:ro
    ports:
      - "7881:7881"
      - "${LIVEKIT_UDP_PORT_START}-${LIVEKIT_UDP_PORT_END}:${LIVEKIT_UDP_PORT_START}-${LIVEKIT_UDP_PORT_END}/udp"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  livekit_config:
