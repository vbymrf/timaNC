services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tima}
      POSTGRES_USER: ${POSTGRES_USER:-tima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-dev_redis_change_me}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_change_me}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tima_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tima_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_change_me}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/tima-media-e2e
        mc mb --ignore-existing local/tima-media-public
        mc mb --ignore-existing local/tima-public-staging
    restart: "no"

  migrate:
    build:
      context: ../server/migrations
      dockerfile: Dockerfile
    image: tima-migrate:dev
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-tima}:${POSTGRES_PASSWORD:-dev_postgres_change_me}@postgres:5432/${POSTGRES_DB:-tima}?sslmode=disable
      - up
    restart: "no"

  tima-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: tima-server:dev
    environment:
      HTTP_ADDR: :8080
      APP_ENV: development
      DEV_OTP: ${DEV_OTP:-000000}
      TOKEN_PEPPER: ${TOKEN_PEPPER:-development-token-pepper}
      OTP_PEPPER: ${OTP_PEPPER:-development-otp-pepper}
      DATABASE_URL: postgres://${POSTGRES_USER:-tima}:${POSTGRES_PASSWORD:-dev_postgres_change_me}@postgres:5432/${POSTGRES_DB:-tima}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_change_me}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-tima_dev}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev_minio_change_me}
      MINIO_PRIVATE_BUCKET: tima-media-e2e
      MINIO_PUBLIC_BUCKET: tima-media-public
      MINIO_STAGING_BUCKET: tima-public-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  tima-worker:
    image: tima-server:dev
    entrypoint: ["/tima-worker"]
    environment:
      APP_ENV: development
      TOKEN_PEPPER: ${TOKEN_PEPPER:-development-token-pepper}
      OTP_PEPPER: ${OTP_PEPPER:-development-otp-pepper}
      DATABASE_URL: postgres://${POSTGRES_USER:-tima}:${POSTGRES_PASSWORD:-dev_postgres_change_me}@postgres:5432/${POSTGRES_DB:-tima}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_change_me}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  realtime-gw:
    image: tima-server:dev
    entrypoint: ["/realtime-gw"]
    environment:
      HTTP_ADDR: :8081
      APP_ENV: development
      TOKEN_PEPPER: ${TOKEN_PEPPER:-development-token-pepper}
      OTP_PEPPER: ${OTP_PEPPER:-development-otp-pepper}
      DATABASE_URL: postgres://${POSTGRES_USER:-tima}:${POSTGRES_PASSWORD:-dev_postgres_change_me}@postgres:5432/${POSTGRES_DB:-tima}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_change_me}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
      args:
        CADDY_VERSION: 2.11.4-alpine
        CADDYFILE: Caddyfile.dev
    image: tima-caddy:dev
    depends_on:
      tima-server:
        condition: service_started
      realtime-gw:
        condition: service_started
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  livekit-config:
    build:
      context: ./livekit
      dockerfile: Dockerfile
    image: tima-livekit-config:dev
    profiles: ["phase2"]
    environment:
      LIVEKIT_BIND_ADDRESS: ${LIVEKIT_BIND_ADDRESS:-0.0.0.0}
      LIVEKIT_UDP_PORT_START: ${LIVEKIT_UDP_PORT_START:-50000}
      LIVEKIT_UDP_PORT_END: ${LIVEKIT_UDP_PORT_END:-50020}
      LIVEKIT_USE_EXTERNAL_IP: ${LIVEKIT_USE_EXTERNAL_IP:-false}
      LIVEKIT_ENABLE_LOOPBACK_CANDIDATE: ${LIVEKIT_ENABLE_LOOPBACK_CANDIDATE:-true}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_change_me}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev_livekit_secret_change_me_1234567890}
    volumes:
      - livekit_config:/rendered
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed \
          -e 's|$${LIVEKIT_BIND_ADDRESS}|'"$${LIVEKIT_BIND_ADDRESS}"'|g' \
          -e 's|$${LIVEKIT_UDP_PORT_START}|'"$${LIVEKIT_UDP_PORT_START}"'|g' \
          -e 's|$${LIVEKIT_UDP_PORT_END}|'"$${LIVEKIT_UDP_PORT_END}"'|g' \
          -e 's|$${LIVEKIT_USE_EXTERNAL_IP}|'"$${LIVEKIT_USE_EXTERNAL_IP}"'|g' \
          -e 's|$${LIVEKIT_ENABLE_LOOPBACK_CANDIDATE}|'"$${LIVEKIT_ENABLE_LOOPBACK_CANDIDATE}"'|g' \
          -e 's|$${REDIS_PASSWORD}|'"$${REDIS_PASSWORD}"'|g' \
          -e 's|$${LIVEKIT_API_KEY}|'"$${LIVEKIT_API_KEY}"'|g' \
          -e 's|$${LIVEKIT_API_SECRET}|'"$${LIVEKIT_API_SECRET}"'|g' \
          /template/livekit.yaml.template > /rendered/livekit.yaml
    restart: "no"

  livekit:
    image: livekit/livekit-server:v1.13.2
    profiles: ["phase2"]
    command: ["--config", "/etc/livekit/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
      livekit-config:
        condition: service_completed_successfully
    volumes:
      - livekit_config:/etc/livekit:ro
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50020}:${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50020}/udp"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  livekit_config:
