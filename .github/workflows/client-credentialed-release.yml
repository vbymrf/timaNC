name: Client credentialed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Signed Android internal candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-release
    env:
      TIMA_ANDROID_BASE_URL: ${{ vars.TIMA_ANDROID_BASE_URL }}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"
      - name: Require Android release credentials
        run: python3 scripts/release/preflight.py android
      - name: Materialize ephemeral Android inputs
        shell: bash
        run: |
          umask 077
          printf '%s' "${FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > client/apps/android/google-services.json
          printf '%s' "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/android-release.keystore"
      - name: Build unsigned release AAB
        working-directory: client
        run: >-
          gradle --no-daemon :apps:android:bundleRelease
          -Ptima.android.baseUrl="${TIMA_ANDROID_BASE_URL}"
          -Ptima.android.integrityProjectNumber="${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER}"
      - name: Sign and verify release AAB
        shell: bash
        env:
          KEYSTORE: ${{ runner.temp }}/android-release.keystore
        run: |
          unsigned="$(find client/apps/android/build/outputs/bundle/release -name '*.aab' -type f -print -quit)"
          test -n "${unsigned}"
          output="client/apps/android/build/outputs/bundle/release/Tima-internal-signed.aab"
          cp "${unsigned}" "${output}"
          jarsigner \
            -keystore "${KEYSTORE}" \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
            -keypass:env ANDROID_SIGNING_KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "${output}" \
            "${ANDROID_SIGNING_KEY_ALIAS}"
          jarsigner -verify -strict "${output}"
      - name: Upload signed Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-internal-signed-aab
          path: client/apps/android/build/outputs/bundle/release/Tima-internal-signed.aab
          if-no-files-found: error
      - name: Remove Android credentials
        if: always()
        shell: bash
        run: rm -f client/apps/android/google-services.json "${RUNNER_TEMP}/android-release.keystore"

  ios:
    name: Signed iOS archive
    runs-on: macos-15
    timeout-minutes: 50
    environment: ios-release
    env:
      TIMA_IOS_BASE_URL: ${{ vars.TIMA_IOS_BASE_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_IOS_SIGNING_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
      APPLE_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_IOS_CERTIFICATE_P12_BASE64 }}
      APPLE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_CERTIFICATE_PASSWORD }}
      APPLE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"
      - name: Require iOS release credentials
        run: python3 scripts/release/preflight.py ios
      - name: Import ephemeral iOS signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${APPLE_IOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ios-release.p12"
          printf '%s' "${APPLE_IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ios-release.mobileprovision"
          security create-keychain -p "${RUNNER_TEMP}" release.keychain
          security set-keychain-settings -lut 21600 release.keychain
          security unlock-keychain -p "${RUNNER_TEMP}" release.keychain
          security import "${RUNNER_TEMP}/ios-release.p12" \
            -k release.keychain \
            -P "${APPLE_IOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${RUNNER_TEMP}" release.keychain
          security list-keychains -d user -s release.keychain
          profile_uuid="$(security cms -D -i "${RUNNER_TEMP}/ios-release.mobileprovision" | plutil -extract UUID raw -)"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${RUNNER_TEMP}/ios-release.mobileprovision" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          printf 'PROFILE_UUID=%s\n' "${profile_uuid}" >> "${GITHUB_ENV}"
      - name: Build Kotlin release XCFramework
        working-directory: client
        run: gradle --no-daemon :apps:ios:assembleTimaIosAppReleaseXCFramework
      - name: Build signed device archive
        working-directory: client
        run: |
          xcodebuild \
            -project apps/ios/xcode/Tima.xcodeproj \
            -scheme Tima \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Tima.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${APPLE_BUNDLE_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${APPLE_IOS_SIGNING_IDENTITY}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            archive
          codesign --verify --deep --strict --verbose=2 build/Tima.xcarchive/Products/Applications/Tima.app
          ditto -c -k --sequesterRsrc --keepParent build/Tima.xcarchive build/Tima-ios-signed-xcarchive.zip
      - name: Upload signed iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-xcarchive
          path: client/build/Tima-ios-signed-xcarchive.zip
          if-no-files-found: error
      - name: Remove iOS credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain release.keychain || true
          rm -f "${RUNNER_TEMP}/ios-release.p12" "${RUNNER_TEMP}/ios-release.mobileprovision"
          test -z "${PROFILE_UUID:-}" || rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

  windows:
    name: Signed Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 40
    environment: windows-release
    env:
      TIMA_WINDOWS_BASE_URL: ${{ vars.TIMA_WINDOWS_BASE_URL }}
      WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGNING_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_SHA256 }}
      WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"
      - name: Require Windows release credentials
        run: python scripts/release/preflight.py windows
      - name: Materialize and verify signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64)
          $certificate = Join-Path $env:RUNNER_TEMP "windows-release.pfx"
          [IO.File]::WriteAllBytes($certificate, $bytes)
          $actual = (Get-FileHash -Algorithm SHA256 $certificate).Hash
          if ($actual -ne $env:WINDOWS_SIGNING_CERTIFICATE_SHA256.Replace(" ", "")) {
            throw "Windows signing certificate SHA-256 mismatch"
          }
      - name: Build unsigned MSIX
        working-directory: client
        run: gradle --no-daemon :apps:windows:packageMsixUnsigned
      - name: Sign and verify MSIX
        shell: pwsh
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found" }
          $unsigned = Get-ChildItem "client/apps/windows/build/distributions/*-unsigned.msix" |
            Select-Object -First 1
          if (-not $unsigned) { throw "Unsigned MSIX was not produced" }
          $signed = "client/apps/windows/build/distributions/Tima-0.1.0-signed.msix"
          Copy-Item $unsigned.FullName $signed
          & $signtool.FullName sign /fd SHA256 /td SHA256 `
            /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL `
            /f "$env:RUNNER_TEMP\windows-release.pfx" `
            /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
            $signed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa /all $signed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload signed Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed-msix
          path: client/apps/windows/build/distributions/Tima-0.1.0-signed.msix
          if-no-files-found: error
      - name: Remove Windows credentials
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\windows-release.pfx" -Force -ErrorAction SilentlyContinue
