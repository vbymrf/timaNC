name: Server credential gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gateway-credentials:
    name: Validate attestation and push inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: server-production
    env:
      ATTESTATION_GATEWAY_URL: ${{ vars.ATTESTATION_GATEWAY_URL }}
      ATTESTATION_GATEWAY_TOKEN: ${{ secrets.ATTESTATION_GATEWAY_TOKEN }}
      PUSH_GATEWAY_URL: ${{ vars.PUSH_GATEWAY_URL }}
      PUSH_GATEWAY_TOKEN: ${{ secrets.PUSH_GATEWAY_TOKEN }}
      PUSH_TOKEN_ENCRYPTION_KEY: ${{ secrets.PUSH_TOKEN_ENCRYPTION_KEY }}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
      APPLE_APP_ATTEST_TEAM_ID: ${{ vars.APPLE_APP_ATTEST_TEAM_ID }}
      APPLE_APP_ATTEST_KEY_ID: ${{ vars.APPLE_APP_ATTEST_KEY_ID }}
      APPLE_APP_ATTEST_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_APP_ATTEST_PRIVATE_KEY_P8_BASE64 }}
      APPLE_APNS_TEAM_ID: ${{ vars.APPLE_APNS_TEAM_ID }}
      APPLE_APNS_KEY_ID: ${{ vars.APPLE_APNS_KEY_ID }}
      APPLE_APNS_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_APNS_PRIVATE_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require all production gateway credentials
        run: python3 scripts/release/preflight.py server
