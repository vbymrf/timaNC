name: Phase 1 Dev Stack

on:
  pull_request:
    paths:
      - "client/**"
      - "schema/openapi/client-api.yaml"
      - "gen/**"
      - "infra/**"
      - "server/**"
      - ".github/workflows/dev-stack.yml"
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "schema/openapi/client-api.yaml"
      - "gen/**"
      - "infra/**"
      - "server/**"
      - ".github/workflows/dev-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: infra/docker-compose.dev.yml

jobs:
  compose-config:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate configuration
        run: docker compose -f "${COMPOSE_FILE}" config --quiet

  smoke:
    name: Smoke health and readiness
    needs: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"

      - name: Start development stack
        run: docker compose -f "${COMPOSE_FILE}" up -d --build --wait

      - name: Check liveness
        run: curl --fail --show-error --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/healthz

      - name: Check readiness
        run: curl --fail --show-error --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/readyz

      - name: Exercise authentication rotation
        shell: bash
        run: |
          challenge="$(
            curl --fail --show-error --silent \
              -H 'Content-Type: application/json' \
              -d '{"phone":"+15550001001","locale":"en"}' \
              http://localhost:8080/v1/auth/register | jq -r .challenge_id
          )"
          verify_body="$(
            jq -cn --arg challenge "${challenge}" \
              '{challenge_id:$challenge,otp:"000000",password:"phase1-test-password",display_name:"CI user",device:{name:"CI device",platform:"android",identity_public_key:"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",signing_public_key:"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}}'
          )"
          attestation="$(
            VERIFY_BODY="${verify_body}" python3 - <<'PY'
          import base64, hashlib, hmac, json, os
          challenge = hashlib.sha256(os.environ["VERIFY_BODY"].encode()).digest()
          proof = hmac.new(b"development-attestation-key", b"android\0\0" + challenge, hashlib.sha256).digest()
          print(json.dumps({
              "integrity_token": base64.b64encode(proof).decode(),
              "nonce": base64.b64encode(challenge).decode(),
          }, separators=(",", ":")))
          PY
          )"
          attestation_token="$(
            curl --fail --show-error --silent \
              -H 'Content-Type: application/json' \
              -d "${attestation}" \
              http://localhost:8080/v1/verify/integrity/android | jq -r .attestation_token
          )"
          session="$(
            curl --fail --show-error --silent \
              -H 'Content-Type: application/json' \
              -H "X-Attestation-Token: ${attestation_token}" \
              -d "${verify_body}" \
              http://localhost:8080/v1/auth/verify
          )"
          device="$(jq -r .device.id <<<"${session}")"
          refreshed="$(
            curl --fail --show-error --silent \
              -H 'Content-Type: application/json' \
              -d '{"refresh_token":"'"$(jq -r .refresh_token <<<"${session}")"'","device_id":"'"${device}"'"}' \
              http://localhost:8080/v1/auth/refresh
          )"
          curl --fail --show-error --silent -o /dev/null \
            -X POST \
            -H "Authorization: Bearer $(jq -r .access_token <<<"${refreshed}")" \
            -H "X-Device-Id: ${device}" \
            http://localhost:8080/v1/auth/logout

      - name: Exercise KMP two-device messaging roundtrip
        working-directory: client
        env:
          TIMA_E2E_BASE_URL: http://localhost:8080
          TIMA_REQUIRE_HTTP_E2E: "true"
        run: gradle --no-daemon jvmTest

      - name: Verify outbox and Redis Stream state
        shell: bash
        run: |
          pending="$(
            docker compose -f "${COMPOSE_FILE}" exec -T postgres \
              psql -U "${POSTGRES_USER:-tima}" -d "${POSTGRES_DB:-tima}" -Atc \
              "SELECT count(*) FROM outbox_events WHERE published_at IS NULL"
          )"
          stream_length="$(
            docker compose -f "${COMPOSE_FILE}" exec -T redis \
              redis-cli -a "${REDIS_PASSWORD:-dev_redis_change_me}" --no-auth-warning \
              XLEN message.ingest
          )"
          test "${pending}" = "0"
          # The black-box journey publishes one create and one immutable edit event.
          test "${stream_length}" = "2"

      - name: Show service state
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" ps --all

      - name: Show service logs
        if: failure()
        run: docker compose -f "${COMPOSE_FILE}" logs --no-color

      - name: Stop development stack
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down --volumes --remove-orphans
